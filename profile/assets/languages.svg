<svg
  aria-labelledby="title"
  height="210"
  role="img"
  viewBox="0 0 360 210"
  width="360"
  xmlns="http://www.w3.org/2000/svg"
>
  <!-- Written for tilli-pro/intrastate (scripts/generate-github-stats). -->
  <title id="title">Most Used Languages</title>
  <style>
  .card {
    font-family:
      -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial,
      sans-serif;
  }
  .heading {
    font-size: 15px;
    font-weight: 600;
    fill: rgb(72, 148, 224);
  }
  .lang {
    font-size: 12px;
    font-weight: 600;
    fill: rgb(135, 135, 135);
  }
  .percent {
    font-size: 12px;
    fill: rgb(150, 150, 150);
  }
  </style>
  <defs>
    <clipPath id="bar">
      <rect height="8" rx="4" width="320" x="20" y="50" />
    </clipPath>
  </defs>
  <rect
    fill="none"
    height="209"
    rx="6"
    stroke="#8B8B8B22"
    width="359"
    x="0.5"
    y="0.5"
  />
  <g class="card">
    <text class="heading" x="20" y="33">Most Used Languages</text>
    <g clip-path="url(#bar)">
      <rect fill="#8B8B8B22" height="8" width="320" x="20" y="50" />
      <rect class="progress-item" x="20" y="50" width="107.63" height="8" fill="#3178c6" />
      <rect class="progress-item" x="127.63" y="50" width="77.79" height="8" fill="#f1e05a" />
      <rect class="progress-item" x="205.42" y="50" width="50.11" height="8" fill="#4F5D95" />
      <rect class="progress-item" x="255.53" y="50" width="31.67" height="8" fill="#7355dd" />
      <rect class="progress-item" x="287.2" y="50" width="24.65" height="8" fill="#b07219" />
      <rect class="progress-item" x="311.85" y="50" width="20.14" height="8" fill="#3572A5" />
      <rect class="progress-item" x="331.99" y="50" width="2.92" height="8" fill="#A97BFF" />
      <rect class="progress-item" x="334.91" y="50" width="2.62" height="8" fill="#F05138" />
      <rect class="progress-item" x="337.53" y="50" width="2.47" height="8" fill="#8b949e" />
    </g>
    <g class="lang-item"><circle cx="25" cy="80" r="5" fill="#3178c6" /><text x="36" y="84"><tspan class="lang">TypeScript</tspan> <tspan class="percent">33.63%</tspan></text></g>
    <g class="lang-item"><circle cx="185" cy="80" r="5" fill="#f1e05a" /><text x="196" y="84"><tspan class="lang">JavaScript</tspan> <tspan class="percent">24.31%</tspan></text></g>
    <g class="lang-item"><circle cx="25" cy="104" r="5" fill="#4F5D95" /><text x="36" y="108"><tspan class="lang">PHP</tspan> <tspan class="percent">15.66%</tspan></text></g>
    <g class="lang-item"><circle cx="185" cy="104" r="5" fill="#7355dd" /><text x="196" y="108"><tspan class="lang">C#</tspan> <tspan class="percent">9.90%</tspan></text></g>
    <g class="lang-item"><circle cx="25" cy="128" r="5" fill="#b07219" /><text x="36" y="132"><tspan class="lang">Java</tspan> <tspan class="percent">7.70%</tspan></text></g>
    <g class="lang-item"><circle cx="185" cy="128" r="5" fill="#3572A5" /><text x="196" y="132"><tspan class="lang">Python</tspan> <tspan class="percent">6.29%</tspan></text></g>
    <g class="lang-item"><circle cx="25" cy="152" r="5" fill="#A97BFF" /><text x="36" y="156"><tspan class="lang">Kotlin</tspan> <tspan class="percent">0.91%</tspan></text></g>
    <g class="lang-item"><circle cx="185" cy="152" r="5" fill="#F05138" /><text x="196" y="156"><tspan class="lang">Swift</tspan> <tspan class="percent">0.82%</tspan></text></g>
    <g class="lang-item"><circle cx="25" cy="176" r="5" fill="#8b949e" /><text x="36" y="180"><tspan class="lang">Other</tspan> <tspan class="percent">0.77%</tspan></text></g>
  </g>
</svg>
